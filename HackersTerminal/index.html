<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@100..800&family=Martel+Sans:wght@200;300;400;600;700;800;900&display=swap');

        body {
            background-color: green;
            color: white;
            font-family: "Martel Sans", sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <script>
        const addItem = async (item) => {
            await randomDelay();
            let div = document.createElement("div");
            div.innerHTML = item;
            document.body.append(div);
        }

        const randomDelay = () => {
            return new Promise((resolve, reject) => {
                let timeout = 1 + 5 * Math.random();
                setTimeout(() => {
                    resolve();
                }, timeout * 1000);
            });
        }

        async function main() {
            setInterval(() => {
                let last = document.body.lastElementChild;
                if (last) {
                    last.style.color = "yellow";
                }
            }, 400);
        }

        let text = [
            "Initialized Hacking now reading your data",
            "Reading Your Files",
            "Password File Detected",
            "Sending All Password and Personal Files To Server",
            "Cleaning Up"
        ];

        (async () => {
            for (const item of text) {
                await addItem(item);
            }
            main();
        })();
    </script>
    </script>
</body>

</html>
